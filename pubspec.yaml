name: ringr
description: "A audio and video calling app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

  # Google login
  google_sign_in: ^7.2.0

  # Permissions / contacts
  permission_handler: ^12.0.3
  flutter_contacts: ^2.4.1

  # Utilities
  crypto: ^3.0.7
  path: ^1.9.1
  sqflite: ^2.4.2+1

  # ZEGOCLOUD
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21
  zego_zim: ^2.19.0

  # Camera
  camera: ^0.12.1

dependency_overrides:
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#080B18"
  image: assets/images/ringr_icon.png

  android_12:
    color: "#080B18"
    image: assets/images/ringr_icon.png
    icon_background_color: "#080B18"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ringr_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ringr_icon.png"